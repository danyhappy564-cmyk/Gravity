<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Gravity · SPT 4.1</title>
<style>
:root{
  --bg:#090c12;--surface:#11161f;--surface-2:#141b26;--raised:#1a2230;--line:#212a38;--line-2:#2b3647;
  --text:#e8edf6;--muted:#8f9bb0;--dim:#647089;
  --primary:#6ea8ff;--primary-2:#4f8ef0;--primary-soft:#6ea8ff1a;
  --gold:#e8b04b;--green:#5fd4a6;--amber:#f0c070;--red:#f27f8c;--violet:#a78bfa;
  --drawer:236px;--appbar:64px;--r:14px;
}
*{box-sizing:border-box}
html{scrollbar-color:#2a3446 transparent}
body{margin:0;color:var(--text);font:14px/1.55 "Segoe UI","Malgun Gothic",system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 560px at 8% -12%,#1a2c50 0%,transparent 60%),radial-gradient(900px 520px at 108% 4%,#2a1f3d4d 0%,transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
::selection{background:#6ea8ff55}

/* app bar */
.appbar{position:sticky;top:0;z-index:40;height:var(--appbar);display:flex;align-items:center;gap:18px;padding:0 22px;background:#0b0f16dc;border-bottom:1px solid #1b2330;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;min-width:calc(var(--drawer) - 22px)}
.brand svg{width:34px;height:34px;flex-shrink:0;filter:drop-shadow(0 0 8px #6ea8ff33);border-radius:8px}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text b{font-size:18px;font-weight:760;letter-spacing:.5px;background:linear-gradient(90deg,#eef4ff,#8fb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-text small{font-size:10.5px;color:var(--muted);letter-spacing:.5px;margin-top:3px}
.mock{font-size:10px;letter-spacing:1px;color:var(--gold);border:1px solid #e8b04b55;background:#e8b04b12;border-radius:5px;padding:2px 6px;margin-left:4px}
.tools{margin-left:auto;display:flex;align-items:center;gap:14px}
.tool{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
select{background:#0c1119;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;outline:none}
select:focus{border-color:var(--primary)}
.seg{display:inline-flex;background:#0a0e14;border:1px solid #222b39;border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);font-size:12px;padding:5px 11px;border-radius:6px;white-space:nowrap}
.seg button.on{background:#1f3150;color:#d5e4ff;box-shadow:0 0 0 1px #6ea8ff40 inset}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.iconbtn{display:none;border:1px solid var(--line-2);background:none;border-radius:8px;width:36px;height:36px}

/* drawer */
.drawer{position:fixed;top:var(--appbar);bottom:0;left:0;width:var(--drawer);background:linear-gradient(180deg,#0e1219,#0a0d13);border-right:1px solid #1b2330;padding:18px 12px 14px;display:flex;flex-direction:column;z-index:35;overflow:auto}
.nav-cap{font-size:10px;letter-spacing:1.6px;color:#5f6b80;font-weight:650;padding:14px 12px 8px}
.nav-cap:first-child{padding-top:0}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#a9b3c4;text-align:left;padding:9px 12px;margin:2px 0;border-radius:8px;font-size:13px;transition:background .15s,color .15s}
.nav-btn:hover{background:#ffffff08;color:var(--text)}
.nav-btn .ic{width:18px;text-align:center;opacity:.8}
.nav-btn.on{background:linear-gradient(90deg,#6ea8ff26,#6ea8ff06);color:#d8e6ff;box-shadow:inset 3px 0 var(--primary)}
.nav-btn.on .ic{opacity:1;color:var(--primary);text-shadow:0 0 12px #6ea8ff88}
.nav-btn .badge{margin-left:auto;font-size:10px;color:var(--muted);background:#ffffff0a;border-radius:10px;padding:1px 7px}
.drawer-foot{margin-top:auto;border-top:1px solid #1b2330;padding:14px 10px 0;font-size:11px;color:var(--dim);line-height:1.8}
.drawer-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 8px var(--green)}
.mono{font-family:Consolas,"Cascadia Mono",monospace}

/* main */
main{margin-left:var(--drawer);padding:26px 32px 60px;max-width:1500px}
.crumb{font-size:11px;color:var(--dim);margin-bottom:8px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.head h1{font-size:27px;font-weight:720;letter-spacing:-.6px;background:linear-gradient(90deg,#f2f6ff,#b7cdf5);-webkit-background-clip:text;background-clip:text;color:transparent}
.head p{color:var(--muted);font-size:13px;margin-top:5px;max-width:760px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{position:relative;background:linear-gradient(180deg,#141a24,#0f141c);border:1px solid #1f2835;border-radius:var(--r);padding:20px;box-shadow:0 1px 0 #ffffff07 inset,0 12px 32px #00000040;min-width:0;transition:border-color .2s}
.card:hover{border-color:#2a3546}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h2{font-size:15px;font-weight:660;display:flex;align-items:center;gap:9px}
.card-h h2 .ic{color:var(--primary)}
.card-h p{color:var(--muted);font-size:12px;margin-top:3px}
.card.off{opacity:.55}
.sub{font-size:11px;letter-spacing:1.2px;color:var(--dim);font-weight:650;margin:18px 0 8px;text-transform:uppercase}
.sub:first-child{margin-top:0}

/* controls */
.ctl{padding:10px 0;border-top:1px dashed #1e2733}
.ctl:first-of-type{border-top:0}
.ctl.dis{opacity:.45}
.ctl.dis *{cursor:not-allowed}
.ctl-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.ctl-h .val{margin-left:auto;font-size:12px;color:#cfe0ff;background:#6ea8ff14;border:1px solid #6ea8ff30;border-radius:6px;padding:1px 8px;white-space:nowrap}
.tip{position:relative;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid #3a4558;color:var(--muted);font-size:10px;cursor:help;flex-shrink:0}
.tip:hover:after,.tip:focus:after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:280px;background:#1b2433;border:1px solid var(--line-2);color:var(--text);font-size:12px;line-height:1.5;padding:8px 10px;border-radius:8px;z-index:60;box-shadow:0 8px 24px #0009;white-space:normal}
.ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--primary) var(--p),#273142 var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--primary) var(--p),#273142 var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 0 0 3px #6ea8ff55,0 2px 6px #0008}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #6ea8ff55}
input[type=range]:disabled{filter:grayscale(1)}
.range2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.range2 label{font-size:10.5px;color:var(--dim)}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tr{width:36px;height:20px;border-radius:20px;background:#323c4d;position:relative;flex-shrink:0;transition:.15s}
.sw .tr:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#aeb7c6;transition:.15s}
.sw input:checked+.tr{background:linear-gradient(90deg,#3d6fd1,#6ea8ff)}
.sw input:checked+.tr:after{left:19px;background:#fff;box-shadow:0 0 8px #6ea8ffaa}
.sw input:disabled+.tr{opacity:.4}
.sw input:focus-visible+.tr{outline:2px solid var(--primary);outline-offset:3px}
.sw-row{display:flex;align-items:center;gap:8px}
.sw-row .grow{flex:1}
.ratio-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#1c2431;margin:4px 0 8px}
.ratio-bar span{height:100%;transition:width .15s}
.ratio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:4px 14px}
.ratio-grid .r-l{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ratio-grid .r-l i{width:8px;height:8px;border-radius:2px;display:inline-block}
.ratio-grid .r-l b{margin-left:auto;color:var(--text);font-weight:600}
.sum{font-size:11px;padding:1px 7px;border-radius:6px}
.sum.ok{color:var(--green);background:#5fd4a614}
.sum.bad{color:var(--amber);background:#f0c07014}
.mini-btn{border:1px solid var(--line-2);background:#0e131b;border-radius:7px;padding:4px 10px;font-size:12px;color:var(--muted)}
.mini-btn:hover{color:var(--text);border-color:#3a4760}
.btn{border:1px solid var(--line-2);background:#121925;border-radius:8px;padding:7px 14px;font-size:12.5px}
.btn:hover{border-color:#3d4b63}
.btn.pri{background:linear-gradient(180deg,#78b0ff,#4f8ef0);color:#06101f;border-color:transparent;font-weight:650}
.btn.danger{color:var(--red);border-color:#f27f8c44}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=number],input[type=text],textarea{background:#0c1119;border:1px solid var(--line-2);border-radius:7px;padding:5px 8px;outline:none;width:100%}
input[type=number]{width:70px;text-align:right}
input:focus,textarea:focus{border-color:var(--primary)}
textarea{min-height:120px;font-family:Consolas,monospace;font-size:12px;resize:vertical}
.choice{display:grid;gap:10px}
.choice.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{border:1px solid var(--line-2);background:#0e131b;border-radius:11px;padding:12px;text-align:left;transition:.15s}
.opt:hover{border-color:#3d4b63}
.opt.on{border-color:var(--primary);background:linear-gradient(180deg,#6ea8ff1c,#6ea8ff08);box-shadow:0 0 0 1px #6ea8ff55 inset}
.opt b{display:block;font-size:13px;margin-bottom:3px}
.opt small{color:var(--muted);font-size:11.5px;line-height:1.45;display:block}
.opt .oi{font-size:18px;color:var(--primary);display:block;margin-bottom:6px}

/* misc */
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line-2);border-radius:20px;padding:2px 9px;font-size:11px;white-space:nowrap}
.pill.good{color:var(--green);border-color:#5fd4a640;background:#5fd4a60c}
.pill.warn{color:var(--amber);border-color:#f0c07040;background:#f0c0700c}
.pill.bad{color:var(--red);border-color:#f27f8c40;background:#f27f8c0c}
.pill.blue{color:#b7d0ff;border-color:#6ea8ff40;background:#6ea8ff12}
.pill.gold{color:var(--gold);border-color:#e8b04b40;background:#e8b04b10}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.notice{display:flex;gap:10px;border:1px solid #6ea8ff30;background:#6ea8ff0e;color:#c3d7f7;border-radius:10px;padding:11px 14px;font-size:12.5px;line-height:1.7}
.notice.warn{border-color:#f0c07035;background:#f0c0700b;color:var(--amber)}
.notice.bad{border-color:#f27f8c40;background:#f27f8c0d;color:var(--red)}
.notice.flat{border-color:var(--line);background:#ffffff05;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:550;color:var(--muted);font-size:11px;letter-spacing:.3px;padding:9px 10px;background:#0c1017;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid #1b2330;vertical-align:middle}
tbody tr:hover td{background:#6ea8ff07}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.num{text-align:right;white-space:nowrap}
.mapname b{display:block}
.mapname small{color:var(--dim);font-family:Consolas,monospace;font-size:10.5px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:thin}
.tabs button{border:0;background:none;color:var(--muted);padding:9px 12px;font-size:12.5px;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.on{color:#d8e6ff;border-bottom-color:var(--primary)}
.tabs button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:#0c1119;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:680}
.stat small{color:var(--muted);font-size:11px}
.tl{background:linear-gradient(180deg,#0c1118,#0a0e14);border:1px solid #1f2a39;border-radius:11px;box-shadow:inset 0 0 40px #6ea8ff0a;padding:8px 4px 2px}
.tl svg{display:block;width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.zone{display:grid;grid-template-columns:auto 1fr auto 150px 52px;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed #1e2733}
.zone:first-child{border-top:0}
.zone.dis{opacity:.45}
.module{overflow:hidden}
.module:before{content:"";position:absolute;right:-60px;top:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,var(--glow,#6ea8ff22),transparent 70%);pointer-events:none}
.msym{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:#6ea8ff14;border:1px solid #6ea8ff38;color:var(--primary)}
.preset{display:flex;flex-direction:column;gap:10px}
.preset.cur{border-color:#6ea8ff66;box-shadow:0 0 0 1px #6ea8ff33 inset,0 12px 32px #0004}
.preset .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.log{display:grid;grid-template-columns:62px 70px 1fr;gap:10px;font-size:12px;padding:7px 0;border-top:1px solid #1b2330}
.log:first-child{border-top:0}
.lock{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px dashed #3a4558;border-radius:9px;color:var(--muted);font-size:12.5px;margin-top:8px}
.lock b{color:var(--text);font-weight:600}
.morebar{display:flex;align-items:center;justify-content:center;gap:12px;border:1px dashed var(--line-2);border-radius:10px;padding:10px;color:var(--muted);font-size:12.5px}
.modlist{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.modrow{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid #1b2330;font-size:13px}
.modrow:first-child{border-top:0}
.modrow input{accent-color:var(--primary);width:15px;height:15px}
.tierin{display:flex;align-items:center;gap:4px}
.tierin input{width:56px}

/* savebar + toast */
.savebar{position:sticky;top:var(--appbar);z-index:34;margin-left:var(--drawer);background:linear-gradient(90deg,#14223af4,#1a1f35f4);border-bottom:1px solid #6ea8ff55;box-shadow:0 8px 24px #0006;padding:10px 32px;backdrop-filter:blur(12px)}
.savebar .row{display:flex;align-items:center;gap:12px}
.savebar .row b{color:#d8e6ff}
.savebar .row .sp{flex:1}
.savebar details{margin-top:6px;font-size:12px;color:var(--muted)}
.savebar ul{margin:6px 0 0;padding-left:18px;columns:2;column-gap:30px}
.toast{position:fixed;right:22px;bottom:22px;background:#1b2433;border:1px solid var(--line-2);border-radius:10px;padding:10px 16px;box-shadow:0 10px 30px #0008;z-index:80;font-size:13px}
body.easy .adv{display:none!important}

@media(max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.choice.c3{grid-template-columns:1fr}}
@media(max-width:900px){
  .iconbtn{display:inline-grid;place-items:center}.brand{min-width:0}.brand-text small,.mock{display:none}
  .drawer{transform:translateX(-100%);transition:transform .2s}.drawer.open{transform:none;box-shadow:20px 0 60px #000a}
  main,.savebar{margin-left:0}main{padding:20px 16px 50px}.g2,.g3{grid-template-columns:1fr}.tool span{display:none}
  .zone{grid-template-columns:auto 1fr 110px 48px}.zone .pill{display:none}
}
@media(max-width:560px){.appbar{gap:8px;padding:0 12px}.tools{gap:6px}.seg button{padding:5px 7px}.stat{grid-template-columns:1fr}.savebar ul{columns:1}}
</style>
<style>
/* v003 additions */
.split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
.list{display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 190px);overflow:auto;position:sticky;top:calc(var(--appbar) + 16px)}
.list .cap{font-size:10px;letter-spacing:1.4px;color:#5f6b80;font-weight:650;padding:12px 10px 6px}
.list .cap:first-child{padding-top:2px}
.list button{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;color:#a9b3c4;padding:7px 10px;border-radius:8px;font-size:12.5px}
.list button:hover{background:#ffffff08;color:var(--text)}
.list button.on{background:linear-gradient(90deg,#6ea8ff26,#6ea8ff06);color:#d8e6ff;box-shadow:inset 3px 0 var(--primary)}
.list button .st{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#3a4558}
.list button .st.on{background:var(--green);box-shadow:0 0 6px var(--green)}
.tog{display:flex;flex-wrap:wrap;gap:6px}
.tog button{border:1px solid var(--line-2);background:#0e131b;color:var(--muted);border-radius:20px;padding:4px 11px;font-size:12px}
.tog button.on{border-color:#6ea8ff88;background:#6ea8ff1c;color:#d5e4ff}
.tog button.gold.on{border-color:#e8b04b88;background:#e8b04b18;color:#f3d79d}
.tog button:disabled{opacity:.4;cursor:not-allowed}
.zbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;background:#0c1119}
.zbox h4{margin:0 0 8px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.ntab{width:100%;border-collapse:separate;border-spacing:0}
.ntab input[type=number]{width:54px;padding:4px 6px}
.ntab td,.ntab th{padding:7px 6px;text-align:center}
.ntab td:first-child,.ntab th:first-child{text-align:left;position:sticky;left:0;background:#10151d;z-index:1}
.ttabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ttabs button{border:1px solid var(--line-2);background:#0e131b;color:var(--muted);border-radius:10px;padding:7px 14px;font-size:12.5px;min-width:74px;text-align:left}
.ttabs button small{display:block;font-size:10.5px;color:var(--dim)}
.ttabs button.on{border-color:var(--primary);background:linear-gradient(180deg,#6ea8ff22,#6ea8ff08);color:#d8e6ff}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kv div{background:#0c1119;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.kv b{display:block;font-size:15px}
.kv small{color:var(--muted);font-size:11px}
.src{font-size:10.5px;color:var(--gold);margin-left:6px}
.fac-h{display:flex;align-items:center;gap:10px}
.fac-h .logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.5px;border:1px solid var(--line-2);background:#0e131b}
.wide-tl .tl{padding:10px 6px 4px}
@media(max-width:1100px){.split{grid-template-columns:1fr}.list{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}.list .cap{width:100%}.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bigtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}

P.orbit={desc:T('ORBIT과 함께 쓸 때 서로 겹치지 않게 맞추는 설정입니다. ORBIT 설정은 읽기만 합니다.','Keeps Gravity and ORBIT in step. ORBIT settings are read-only here.'),render(){
  const O=serverMeta?serverMeta.orbit:{installed:true,version:'3.1',configRead:true,limiter:true,sleepDistance:250,wakeDistance:200,minAwake:6,extractPmc:true,playerScav:true,factionTakeover:['isb'],vanillaTakeover:['raiders','rogues']};
  const on=v=>v?u('on'):u('off'),FN={ruaf:'RUAF',untar:'UNTAR',blackdiv:T('블랙 디비전','Black Division'),isb:'ISB',combine:T('컴바인','Combine')},VN={scavs:T('스캐브','Scavs'),goons:T('굿즈','Goons'),cultists:T('컬티스트','Cultists'),raiders:T('레이더','Raiders'),rogues:T('로그','Rogues'),bloodhounds:T('블러드하운드','Bloodhounds')};
  const names=(a,M)=>(a||[]).map(x=>M[x]?tr(M[x]):x).join(' · ')||tr(T('없음','None'));
  const inst=!!(O&&O.installed),ghost=inst?Math.max(O.sleepDistance||0,O.wakeDistance||0)+10:260;
  const kv=inst?[[tr(T('봇 재우기(AI 리미터)','AI limiter')),on(O.limiter)],[tr(T('잠드는 거리','Sleep distance')),Math.round(O.sleepDistance)+' m'],[tr(T('깨우는 거리','Wake distance')),Math.round(O.wakeDistance)+' m'],[tr(T('늘 깨어 있는 봇','Always-awake bots')),O.fullSleep===false?O.minAwake:0+' ('+tr(T('전부 재움','full sleep'))+')'],[tr(T('PMC 탈출','PMC extraction')),on(O.extractPmc)],[tr(T('플레이어 스캐브 행동','Player-scav behaviour')),on(O.playerScav)],[tr(T('팩션 장악','Faction takeover')),esc(names(O.factionTakeover,FN))],[tr(T('ORBIT이 맡는 바닐라 봇','Vanilla bots ORBIT drives')),esc(names(O.vanillaTakeover,VN))]]:[];
  const head=inst?card(T('ORBIT 감지됨','ORBIT detected'),`<div class="kv">${kv.map(([k,v])=>`<div><b>${v}</b><small>${k}</small></div>`).join('')}</div><p class="muted small" style="margin-top:10px">${tr(O.configRead?T('ORBIT 서버 설정(config.json)에서 읽은 값입니다. 바꾸려면 ORBIT 웹 설정에서 바꾸세요.','Read from ORBIT’s server config.json. Change them in ORBIT’s own web settings.'):T('ORBIT 설정 파일을 못 읽어 ORBIT 기본값으로 맞춥니다.','Could not read ORBIT’s config file; using ORBIT defaults.'))}</p>`,{icon:'◎',right:pill('✓ '+(O.version?'ORBIT '+esc(O.version):tr(T('연동 중','Linked'))),'good')})
    :card(T('ORBIT 없음','ORBIT not found'),`<p class="muted small">${tr(T('user/mods에 ORBIT 폴더가 없습니다.','No ORBIT folder in user/mods.'))}</p>`,{icon:'◎',right:pill(tr(T('없음','None')))});
  const tk=inst?(O.factionTakeover||[]).filter(x=>x==='ruaf'||x==='blackdiv'):[];
  return `<div class="stack">${head}
   <div class="grid g2">
   ${card(T('빈자리 · 상한','Slots · cap'),seg('orbit.extractRefillMode',T('탈출한 PMC 보충','Refill extracted PMCs'),T('살아서 탈출한 PMC와 같은 진영 1명을 보충합니다. 모든 방식은 웨이브·시작만 맵도 포함하며 맵 동시 상한·거리·PMC 종료 시각을 지킵니다.','Replaces an extracted PMC with one of the same side. All styles includes waves and start-only maps; bot cap, distances and PMC hard stop still apply.'),[['off',T('끔','Off')],['infinite',T('무한 방식만','Endless only')],['all',T('모든 방식','All styles')]])+slider('orbit.extractRefillCap',T('판당 탈출 보충 상한','Extraction refill cap per raid'),T('0이면 보충하지 않습니다.','Zero disables refill.'),{min:0,max:100,unit:UI.ppl})+sw('orbit.ghostCount',T('잠든(고스트) 봇도 상한에 셈','Ghost bots count toward cap'),T('잠든 봇도 게임 안에 있는 봇이라 상한에 들어갑니다(끌 수 없음).','Sleeping bots still exist, so they count (fixed).'),{dis:true}),{icon:'⇅'})}
   ${card(T('스폰 거리 · 장악','Distance · takeover'),sw('orbit.nearAsGhost',T('근처 보충은 깨우는 거리 밖에 넣기','Near-player spawns beyond wake distance'),fmt(tr(T('켜면 근처 보충 최소 거리를 ORBIT 잠드는 거리 + 10m({w}m) 이상으로 씁니다. 그 밖에서 나온 봇은 잠든 상태로 시작해 프레임을 아낍니다.','When on, near-player spawns use at least ORBIT’s sleep distance + 10 m ({w} m), so they start asleep and save frames.')),{w:Math.round(ghost)}))+notice(T('팩션 페이지에서 고른 관리 설정이 우선합니다. ORBIT 장악 여부는 관리 선택을 바꾸지 않습니다.','Your Faction page management choice takes priority over ORBIT takeover.'),'flat')+orbitManagementWarning()+(tk.length?`<p class="muted small" style="margin-top:6px">${tr(T('지금 ORBIT이 장악한 팩션','Taken over by ORBIT now'))}: <b>${esc(names(tk,FN))}</b></p>`:'')+`<button class="btn pri" data-act="orbitRecommend" style="margin-top:10px">${tr(T('ORBIT 권장값 적용','Apply ORBIT-friendly values'))}</button>`,{icon:'◎'})}</div>
   ${notice(T('Gravity는 봇을 지우지 않습니다. 봇 재우기·컬링·이동은 ORBIT이 맡고, Gravity는 언제·어디에·누구를 넣을지만 정합니다.','Gravity never removes bots. ORBIT handles sleeping, culling and movement; Gravity only decides when, where and who spawns.'),'flat')}</div>`;}};

P.diag={desc:T('함께 깔린 모드를 감지해 겹치는 기능을 조절하고, 문제가 생기면 기록을 남깁니다.','Detects other mods to avoid overlaps and keeps logs.'),render(){
  const D=serverMeta&&serverMeta.detect,LAY=(serverMeta&&serverMeta.layout)||{};
  const vm=D?Object.entries(Object.fromEntries([...new Set([...Object.keys(D.variantMaps||{}),...(serverMeta.automaticVariants||[])])].map(id=>[id,variantMods(id)]))):[['interchange',['Manimal']],['lighthouse',['Manimal']]];
  const vmText=vm.map(([id,ms])=>`${mname(id)}(${ms.join('·')}${LAY[id]?' · '+tr(T('지난 판','last'))+' '+tr(LAY[id]==='variant'?T('변형','variant'):T('원본','original')):''})`).join(', ');
  const facs=D?['RUAF','UNTAR','BlackDiv'].filter((n,i)=>[D.ruaf,D.untar,D.blackDiv][i]):['RUAF','UNTAR','BlackDiv'];
  const cards=[];
  if(!D||D.orbit)cards.push([detectedMods().find(n=>n.startsWith('ORBIT'))||'ORBIT',T('감지됨 · 봇 재우기·컬링은 ORBIT 담당. ORBIT 연동 페이지에서 맞춥니다.','Detected · sleeping & culling handled by ORBIT. Tune on the ORBIT page.')]);
  if(!D||D.sain)cards.push(['SAIN',T('감지됨 · 난이도는 SAIN 설정이 우선할 수 있습니다.','Detected · SAIN settings may override difficulty.')]);
  if(vm.length)cards.push([(D&&D.mapVariants?'MapVariants · ':'')+[...new Set(vm.flatMap(([,ms])=>ms))].join(' · '),T('변형 맵 감지: '+vmText+'. 판마다 원본/변형을 가려 맵별 설정의 "원본 / 변형 맵" 스위치를 따르고, 구역도 그 판 배치로 다시 계산합니다.','Variant maps: '+vmText+'. Each raid is checked for original vs variant, follows the per-map switches and recomputes zones for that layout.')]);
  if(facs.length)cards.push([facs.join(' · '),T('감지됨 · 팩션 모드 페이지에서 관리할 수 있습니다.','Detected · manage on the Faction mods page.')]);
  return `<div class="stack">
  <div class="grid g2">${cards.map(([n,d])=>card(T(n,n),`<p class="muted small">${tr(d)}</p>`,{right:pill('✓ '+tr(T('호환','OK')),'good')})).join('')}
   ${svmCard()}
  ${card(T('다른 모드가 넣은 PMC','PMCs added by other mods'),seg('compat.otherPmc',T('Gravity가 PMC를 관리하는 맵에서','On maps where Gravity manages PMCs'),T('SPT 원본 PMC 항목은 늘 Gravity 계획으로 바꿉니다. 원본과 다른 PMC 항목은 다른 모드가 넣은 것으로 봅니다.','SPT’s own PMC entries are always replaced by Gravity’s plan. Entries that differ from SPT’s originals count as another mod’s.'),[['keep',T('그대로 둠','Keep')],['remove',T('지우고 Gravity 계획만','Remove')]])+`<p class="muted small" style="margin-top:8px">${tr(T('마지막 판에 남긴 다른 모드 PMC 항목','Other-mod PMC entries kept last raid'))}: <b>${FACMETA&&FACMETA.otherPmc!=null?FACMETA.otherPmc:'—'}</b>${FACMETA&&FACMETA.pmcSigMaps===0?' · '+tr(T('SPT 원본을 못 읽어 구분하지 않음','SPT originals not readable — not distinguishing')):''}</p>`,{icon:'⊕'})}
  ${card(T('ABPS · APBS','ABPS · APBS'),`<p class="muted small">${tr(T('같은 일을 하는 모드입니다. 깔려 있으면 겹치는 Gravity 모듈(ABPS → 스폰, APBS → 장비)을 자동으로 끄고 잠급니다. 지우면 다시 켤 수 있습니다.','Same job as Gravity. If installed, the overlapping module (ABPS → spawns, APBS → loadouts) is turned off and locked.'))}</p>${serverMeta?`<p class="muted small" style="margin-top:8px">ABPS: <b>${abpsDemo?tr(T('있음 · 스폰 잠김','present · spawns locked')):tr(T('없음','none'))}</b> · APBS: <b>${apbsDemo?tr(T('있음 · 장비 잠김','present · loadouts locked')):tr(T('없음','none'))}</b></p>`:''}`,{right:pill(abpsDemo||apbsDemo?'✕ '+tr(T('감지됨','Detected')):tr(T('없음','Not found')),abpsDemo||apbsDemo?'bad':'')})}
  ${card(T('Questing Bots','Questing Bots'),sw('compat.lockWithQuestingBots',T('Questing Bots 감지 시 스폰 잠금','Lock spawns when Questing Bots is detected'),T('기본은 경고만 표시합니다. 켜면 다음 레이드부터 Gravity 스폰을 잠급니다.','Warns by default. Enable to lock Gravity spawns from the next raid.')),{right:pill(qbDemo?'✕ '+tr(T('감지됨','Detected')):tr(T('없음','Not found')),qbDemo?'bad':'')})}
  ${card(T('자동 감지된 변형 맵','Automatically detected variant maps'),`<p>${esc((serverMeta&&serverMeta.automaticVariants||[]).map(mname).join(' · ')||tr(T('없음','None')))}</p><label for="variantMods">${tr(T('추가로 감지할 모드 폴더 이름(한 줄에 하나, 서버 재시작 후 적용)','Additional mod folder names (one per line, applies after server restart)'))}</label><textarea id="variantMods">${esc((state.compat.variantMods||[]).join('\n'))}</textarea>`,{desc:T('등록되지 않은 모드도 SPT 원본과 스폰 지점이 다르면 자동 감지합니다.','Unlisted mods are detected when spawn point IDs differ from SPT originals.')})}
  ${card(T('기록','Logging'),seg('diag.log',T('로그 수준','Log level'),T('꺼짐 = 경고만 · 요약 = 판마다 한 줄 · 자세히 = PMC 분대·보스 항목까지(서버·클라 같이).','Off = warnings only · Summary = one line per raid · Verbose = every PMC squad and boss entry (server and client).'),[['off',T('꺼짐','Off')],['summary',T('요약','Summary')],['verbose',T('자세히','Verbose')]])+sw('diag.report',T('레이드 끝나면 스폰 리포트 저장','Save spawn report'),T('계획과 클라 보고를 config/reports에 JSON으로(최근 20개).','Plan + client report as JSON in config/reports (last 20).'))+sw('diag.botLog',T('봇 장비 기록 저장','Save loadout log'),T('장비를 입힌 봇마다 역할·티어·레벨·주무기·방탄 등급 한 줄(config/reports/gear-last.log, 판마다 새로).','One line per dressed bot: role, tier, level, main weapon, armour class (config/reports/gear-last.log, new each raid).'),{adv:true})+(serverMeta&&serverMeta.reports&&serverMeta.reports.dir?`<p class="muted small" style="margin-top:8px">${tr(T('저장 폴더','Folder'))}: <span class="mono">${esc(serverMeta.reports.dir)}</span>${serverMeta.reports.last?' · '+tr(T('마지막','last'))+' '+esc(serverMeta.reports.last):''}</p>`:''))}</div>
  ${clientCard()}
  ${raidReportCard()}
  ${card(T('최근 알림','Recent messages'),(serverMeta&&serverMeta.recent?serverMeta.recent:[{at:'00:03:12',level:'WARN',text:tr(T('세관: 레이드 100분 감지(기본 40 + SVM 60) — 타임라인을 비율로 늘려 웨이브 18개.','Customs: 100-min raid detected (40 + SVM 60) — timeline stretched, 18 waves.'))}]).slice(0,30).map(e=>`<div class="log"><span class="mono muted">${esc(e.at)}</span>${pill(e.level,e.level==='WARN'?'warn':'blue')}<span>${esc(e.text)}</span></div>`).join('')||`<p class="muted small">${tr(T('알림 없음','No messages'))}</p>`,{right:`<button class="mini-btn" data-act="refreshMeta">${tr(T('새로고침','Refresh'))}</button>`})}
  </div>`;}};

P.raidpresets={desc:T('스폰 흐름·맵별 설정·근처 보충·보스·특수 봇·팩션 모드·이벤트 값을 묶어 저장하고 바꿔 씁니다. 장비 설정은 건드리지 않습니다.','Save and switch spawn, map, near, boss, special, faction and event settings. Loadout is untouched.'),render(){
  const kpi=s=>`<div class="chips">${pill(tr(T('간격','Interval'))+' '+s.spawn.interval+u('min_'))}${pill(tr(T('웨이브','Wave'))+' '+s.spawn.waveMin+'–'+s.spawn.waveMax)}${pill(tr(T('시작 PMC','Start PMC'))+' '+s.spawn.startPmcPct+'%')}${pill(tr(T('무한 보충 맵','Endless maps'))+' '+MAPS.filter(m=>s.maps[m.id].style==='infinite').length)}${pill(tr(T('시작만','Start-only'))+' '+MAPS.filter(m=>s.maps[m.id].style==='start').length)}${s.near&&s.near.on?pill(tr(T('근처 보충','Near')),'blue'):''}</div>`;
  const cur=id=>state.preset===id;
  const builtin=PRESETS.map(p=>`<section class="card preset${cur(p.id)?' cur':''}"><div class="card-h"><div><h2>${tr(p.name)}</h2><p>${tr(p.desc)}</p></div>${cur(p.id)?pill(tr(T('사용 중','In use')),'blue'):pill(tr(T('기본 제공','Built-in')))}</div>${kpi(snapOf(p))}<div class="acts"><button class="btn pri" data-act="applyPreset" data-arg="${p.id}">${tr(T('적용','Apply'))}</button><button class="btn" data-act="dupPreset" data-arg="${p.id}">${tr(T('복제','Duplicate'))}</button></div></section>`).join('');
  const custom=customPresets.map(p=>`<section class="card preset${cur(p.id)?' cur':''}"><div class="card-h"><div><h2>${esc(p.name)}</h2><p>${tr(T('내 레이드 프리셋','My raid preset'))}</p></div>${cur(p.id)?pill(tr(T('사용 중','In use')),'blue'):''}</div>${kpi(Object.assign(pickKeys(DEFAULTS,RAID_KEYS),p.snap))}<div class="acts"><button class="btn pri" data-act="applyPreset" data-arg="${p.id}">${tr(T('적용','Apply'))}</button><button class="btn" data-act="renamePreset" data-arg="${p.id}">${tr(T('이름 바꾸기','Rename'))}</button><button class="btn" data-act="exportPreset" data-arg="${p.id}">${tr(T('내보내기','Export'))}</button><button class="btn danger" data-act="delPreset" data-arg="${p.id}">${tr(T('삭제','Delete'))}</button></div></section>`).join('');
  return `<div class="stack">${notice(T('레이드 프리셋은 레이드 메뉴(스폰 흐름·맵별 설정·근처 보충·보스·특수 봇·팩션 모드·이벤트) 값만 바꿉니다. 장비 쪽은 장비 프리셋에서 따로 고르므로, 예를 들어 "난전" 레이드 + "하드코어" 장비처럼 섞어 쓸 수 있습니다.','Raid presets only change the Raid menu. Loadout presets are picked separately, so you can mix e.g. Chaos raids with Hardcore gear.'),'flat')}${presetDiv(T('기본 제공 프리셋','Built-in presets'))}<div class="grid g3">${builtin}</div>${presetDiv(T('내 프리셋','My presets'),true,(page==='gearpresets'?customTierPresets:customPresets).length)}<div class="grid g3">${custom}
   <section class="card preset" style="border-style:dashed;justify-content:center;align-items:center;text-align:center"><p class="muted small">${tr(T('지금 레이드 설정을 새 프리셋으로','Save current raid settings as a preset'))}</p><button class="btn pri" data-act="newPreset">＋ ${tr(T('현재 레이드 설정 저장','Save current raid settings'))}</button></section></div>
   ${card(T('가져오기 · 내보내기','Import · export'),`<p class="muted small">${tr(T('레이드 프리셋 하나를 .json 파일로 주고받습니다(파일 이름 예: Gravity-raid-내프리셋.json). 저장한 프리셋은 카드의 "내보내기"로 내보냅니다.','Share one raid preset as a .json file (e.g. Gravity-raid-mine.json). Saved presets export from their card.'))}</p><div class="sw-row" style="margin-top:10px"><button class="btn" data-act="exportRaidCur">⇩ ${tr(T('현재 레이드 설정을 JSON 파일로','Export current raid settings'))}</button><button class="btn pri" data-act="importPreset">⇧ ${tr(T('JSON 파일 가져오기','Import .json'))}</button></div>`,{icon:'⇄'})}
   ${spawnPresetCard('presets')}
  </div>`;}};

P.gearpresets={desc:T('T1~T7 값, 티어 편집기 표, 봇별 장비·무기 구성·모드 아이템 설정을 묶어 저장하고 바꿔 씁니다. 레이드 설정은 건드리지 않습니다.','Save and switch tiers, editor tables, per-bot gear, weapon build and mod item settings. Raid settings are untouched.'),render(){
  const kpi=(tiers,mods)=>`<div class="chips">${pill('T1 '+tr(T('관통','pen'))+' '+tiers[0].pen,'gold')}${pill('T7 '+tr(T('관통','pen'))+' '+tiers[6].pen,'gold')}${pill(tr(T('판','Plates'))+' T1 '+tiers[0].fMin+'–'+tiers[0].fMax+' · T7 '+tiers[6].fMin+'–'+tiers[6].fMax)}${pill(tr(T('모드 무기','Mod weapons'))+' '+mods.weapons)}</div>`;
  const base=DEFAULTS.gear.tiers,cur=id=>state.tierPreset===id;

const readVal=el=>el.dataset.t==='b'?el.checked:el.dataset.t==='n'?Number(el.value):el.value;
function writeSetting(p,v,auto=false){
  const k=p.split('.');
  if(k[0]!=='maps'){putPath(state,p,v);return true;}
  const mid=k[1],suffix=k.slice(2).join('.'),targets=[mid,...(isSpawnMap()&&mid===mapSel&&!['zones','zonesAlt'].includes(k[2])?batch:[])];
  const flag=k[2]==='ovr'?k[3]:k[2]==='override'?'flow':'';
  if(flag){if(!CARD_FIELDS[flag])return false;targets.forEach(id=>{if(v)ensureOverride(id,flag);else putPath(state,`maps.${id}.ovr.${flag}`,false);if(flag==='flow')state.maps[id].override=!!v;});return true;}
  const card=mapFieldCard(p);if(card&&!cardOn(mid,card)&&!auto)return false;
  targets.forEach(id=>{if(card&&(auto||id!==mid))ensureOverride(id,card);putPath(state,`maps.${id}.${suffix}`,clone(v));
    if(card==='flow'&&['early','mid','late'].includes(k[2]))putPath(state,`maps.${id}.intensity.${k[2]}`,v);
    if(card==='flow'&&k[2]==='intensity')state.maps[id][k[3]]=v;
  });return true;
}
function apply(el,final){

  if(mk[0]==='maps'&&['zones','zonesAlt'].includes(mk[2])){const m=state.maps[mk[1]],key=mk[2];m[key]||={};m[key][mk[3]]||={on:true,w:100};}
  if(!writeSetting(p,v))return;
  if(p==='orbit.extractRefillCap')state.orbit.refillAfterExtract=state.orbit.extractRefillMode!=='off'&&v>0;
  if(mk[0]==='gear'&&mk[1]==='itemTier'&&v===0)delete state.gear.itemTier[mk[2]];
  if(mk[0]==='gear'&&mk[1]==='tiers'&&mk[3]==='min'&&+mk[2]>0){const pv=state.gear.tiers[+mk[2]-1];pv.max=Math.max(pv.min,v-1);}
  if((mk[0]==='gear'&&mk[1]==='tiers')||mk[0]==='tierData')markEdited();
  if(el.type==='range'){el.style.setProperty('--p',pctOf(v,+el.min,+el.max));const unit=JSON.parse(el.dataset.unit||'""'),step=+el.step||1;
    document.querySelectorAll(`[data-v="${p}"]`).forEach(x=>x.textContent=showVal(v,unit,step));
    document.querySelectorAll('[data-v*="|"]').forEach(x=>{const[a,b]=x.dataset.v.split('|');if(a===p||b===p)x.textContent=`${showVal(get(a),unit,step)} – ${showVal(get(b),unit,step)}`;});
    if(el.dataset.ratio){const host=el.closest('[data-ratiohost]');const parts=[...host.querySelectorAll('input[type=range]')].map(i=>Number(i.value)),sum=parts.reduce((a,b)=>a+b,0);

  updateSavebar();refreshLive();if(final){const y=window.scrollY;render();window.scrollTo(0,y);}
}

    const r=await fetch('api/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({state})});
    const j=await r.json();
    if(!r.ok||!j.ok){toast(tr(T('저장 실패: ','Save failed: '))+(j.error||r.status));return;}
    saved=clone(state);
    toast(j.clamped&&j.clamped.length?fmt(tr(T('저장했습니다. 범위를 넘은 값 {n}개는 서버가 고쳐 씁니다.','Saved. {n} out-of-range values were clamped.')),{n:j.clamped.length}):u('savedT'));
    rerender();
  }catch(e){toast(tr(T('저장 실패: ','Save failed: '))+e.message);}
}
restoreNavigation();
boot();
</script>
</body>
</html>
