<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Gravity · SPT 4.1</title>
<style>
:root{
  --bg:#090c12;--surface:#11161f;--surface-2:#141b26;--raised:#1a2230;--line:#212a38;--line-2:#2b3647;
  --text:#e8edf6;--muted:#8f9bb0;--dim:#647089;
  --primary:#6ea8ff;--primary-2:#4f8ef0;--primary-soft:#6ea8ff1a;
  --gold:#e8b04b;--green:#5fd4a6;--amber:#f0c070;--red:#f27f8c;--violet:#a78bfa;
  --drawer:236px;--appbar:64px;--r:14px;
}
*{box-sizing:border-box}
html{scrollbar-color:#2a3446 transparent}
body{margin:0;color:var(--text);font:14px/1.55 "Segoe UI","Malgun Gothic",system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 560px at 8% -12%,#1a2c50 0%,transparent 60%),radial-gradient(900px 520px at 108% 4%,#2a1f3d4d 0%,transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
::selection{background:#6ea8ff55}

/* app bar */
.appbar{position:sticky;top:0;z-index:40;height:var(--appbar);display:flex;align-items:center;gap:18px;padding:0 22px;background:#0b0f16dc;border-bottom:1px solid #1b2330;backdrop-filter:blur(14px)}
.brand{display:flex;align-items:center;gap:12px;min-width:calc(var(--drawer) - 22px)}
.brand svg{width:34px;height:34px;flex-shrink:0;filter:drop-shadow(0 0 8px #6ea8ff33);border-radius:8px}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text b{font-size:18px;font-weight:760;letter-spacing:.5px;background:linear-gradient(90deg,#eef4ff,#8fb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-text small{font-size:10.5px;color:var(--muted);letter-spacing:.5px;margin-top:3px}
.mock{font-size:10px;letter-spacing:1px;color:var(--gold);border:1px solid #e8b04b55;background:#e8b04b12;border-radius:5px;padding:2px 6px;margin-left:4px}
.tools{margin-left:auto;display:flex;align-items:center;gap:14px}
.tool{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
select{background:#0c1119;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;outline:none}
select:focus{border-color:var(--primary)}
.seg{display:inline-flex;background:#0a0e14;border:1px solid #222b39;border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);font-size:12px;padding:5px 11px;border-radius:6px;white-space:nowrap}
.seg button.on{background:#1f3150;color:#d5e4ff;box-shadow:0 0 0 1px #6ea8ff40 inset}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.iconbtn{display:none;border:1px solid var(--line-2);background:none;border-radius:8px;width:36px;height:36px}

/* drawer */
.drawer{position:fixed;top:var(--appbar);bottom:0;left:0;width:var(--drawer);background:linear-gradient(180deg,#0e1219,#0a0d13);border-right:1px solid #1b2330;padding:18px 12px 14px;display:flex;flex-direction:column;z-index:35;overflow:auto}
.mode-note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;margin:0 0 14px;border-radius:10px;font-size:12.5px;border:1px solid #2b3446;background:#121925}.mode-note b{font-size:12px;padding:2px 8px;border-radius:6px;background:#1f2a3d;color:#cfe0ff}.mode-note.adv b{background:#2e2350;color:#d9c8ff}.mode-note span{color:var(--muted);flex:1}body:not(.easy) .adv .ctl-h>span:first-child::after,body:not(.easy) .card.adv>.card-h h2::after{content:var(--advtxt);font-size:10px;font-weight:600;color:#c9b6ff;border:1px solid #6a55a0;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:middle}
.apply-table{width:100%}.apply-table th{text-align:left;font-size:12px;color:var(--muted);font-weight:600}.apply-table td{vertical-align:middle;padding:8px 10px}.apply-table td:first-child,.apply-table td:nth-child(2),.apply-table th:first-child,.apply-table th:nth-child(2){width:1%;white-space:nowrap}
.tabs.spawn-tabs{flex-wrap:wrap;gap:8px;border-bottom:0;overflow:visible;padding:12px;background:#0f1520;border:1px solid var(--line);border-radius:12px}.tabs.spawn-tabs button{background:#1a2333;border:1px solid #2c3850;border-radius:8px;color:#c3cfdf;padding:7px 12px}.tabs.spawn-tabs button:hover{background:#212c40}.tabs.spawn-tabs button.on{background:#2a4a7a;border-color:#5b8def;color:#fff}.map-changed{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;background:#5a3d10;color:#ffcf73;font-size:11px;font-weight:600}.grid:has(>details.card.fold){grid-template-columns:1fr!important;gap:0}.fold-acts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}.mini-btn.danger{color:#ff9a9a;border-color:#6a3030}details.card.fold{padding:0;margin-bottom:12px}details.card.fold>summary{list-style:none;cursor:pointer;padding:15px 20px;margin:0}details.card.fold>summary::-webkit-details-marker{display:none}details.card.fold>summary h2::before{content:'▸';display:inline-block;width:16px;color:#8fa3c0}details.card.fold[open]>summary h2::before{content:'▾'}details.card.fold[open]>summary{border-bottom:1px solid var(--line)}details.card.fold>summary:hover{background:#151d2b;border-radius:var(--r)}.fold-body{padding:16px 20px 20px}.fold-right{display:flex;justify-content:flex-end;margin-bottom:10px}.sub-sep{border:0;border-top:1px solid #2b3446;margin:12px 0 4px}
.preset-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}@media(max-width:900px){.preset-pair{grid-template-columns:1fr}}.pp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px;margin:0 0 10px}.pp-head h3{margin:0;font-size:14px}.pp-head select{width:auto;min-width:140px}.ps-h{font-size:14px;margin:10px 0 2px;color:#cfdcf5}
.plate-list{display:grid;gap:8px;margin:6px 0 12px}.plate-box>summary{cursor:pointer;font-size:12.5px;color:#cfdcf5;padding:6px 0}.plate-box .modlist{max-height:220px}
.modrow>span:first-child{flex:1;min-width:0}.modsrc{width:100%;background:none;border:0;border-top:1px solid #1b2330;color:inherit;text-align:left;cursor:pointer}.modsrc .ck{color:var(--primary);width:16px}.modsrc.off{opacity:.55}.modsrc>span:nth-child(2){flex:1}input[type=search]{background:#0c1119;border:1px solid var(--line-2);border-radius:7px;padding:6px 9px;outline:none;width:100%;color:inherit}
.card.preset.credited{border-color:#e7c46a;box-shadow:0 0 0 1px rgba(231,196,106,.55) inset;animation:goldGlow 2.6s ease-in-out infinite}
@keyframes goldGlow{0%,100%{border-color:#c9a24a;box-shadow:0 0 0 1px rgba(231,196,106,.45) inset,0 0 6px rgba(231,196,106,.18)}50%{border-color:#ffe08a;box-shadow:0 0 0 1px rgba(255,224,138,.9) inset,0 0 18px rgba(255,214,110,.55)}}
@media (prefers-reduced-motion:reduce){.card.preset.credited{animation:none}}
.credit{color:#e7b7c8;margin-top:6px;white-space:pre-line}
/* 아이템 티어 · 티어 요약 */
.how summary h2{font-size:14px;margin:0}.howgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:10px}.howgrid>div{background:#0c1119;border:1px solid var(--line-2);border-radius:9px;padding:10px 12px}.howgrid p{margin:6px 0 0;font-size:12.5px;line-height:1.55;color:var(--muted,#9aa6b8)}
.chipbtn{background:#0c1119;border:1px solid var(--line-2);border-radius:999px;padding:4px 10px;color:inherit;cursor:pointer;font-size:12.5px}.chipbtn.on{border-color:var(--primary);background:rgba(90,140,255,.16)}.chipbtn small{opacity:.65;margin-left:3px}
.itdist{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:12px 0}.itdist button{display:flex;flex-direction:column;align-items:center;gap:2px;background:#0c1119;border:1px solid var(--line-2);border-radius:9px;padding:7px 4px;color:inherit;cursor:pointer;min-width:0}.itdist button.on{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary) inset}.itdist .bar{display:flex;align-items:flex-end;width:60%;height:34px;background:#121a26;border-radius:4px;overflow:hidden}.itdist .bar i{display:block;width:100%;background:linear-gradient(180deg,#7aa7ff,#4a6fd1)}.itdist em{font-style:normal;font-weight:600;font-size:12.5px}.itdist small{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.itdist .man{color:#e7c46a}
.ittools{flex-wrap:wrap;gap:8px;margin-bottom:10px}.ittools input[type=search]{flex:1 1 220px;width:auto}
.itbulk{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:#17233a;border:1px solid var(--primary);border-radius:9px;padding:8px 10px;margin-bottom:8px}
.ittable td{vertical-align:middle}.ittable tr.man td{background:rgba(231,196,106,.05)}.ittable tr.sel td{background:rgba(90,140,255,.10)}.ittable .why{max-width:360px;color:var(--muted,#9aa6b8);line-height:1.45}.ittable .why .man{color:#e7c46a;margin-top:3px}.ck{background:none;border:0;color:inherit;font-size:16px;cursor:pointer;padding:0 4px}
.tseg{display:inline-flex;flex-wrap:nowrap;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}.tseg button{background:#0c1119;border:0;border-left:1px solid var(--line-2);color:inherit;padding:4px 7px;font-size:12px;cursor:pointer;white-space:nowrap}.tseg button:first-child{border-left:0}.tseg button.on{background:rgba(90,140,255,.25);font-weight:600}.tseg button.on.man{background:rgba(231,196,106,.28);color:#ffe7a6}.tseg button.ghost{box-shadow:0 0 0 1px rgba(122,167,255,.55) inset}
.tab-sep{display:inline-block;width:1px;align-self:stretch;background:var(--line-2);margin:0 8px}.tabs .sumtab{border-color:rgba(231,196,106,.5)}
.tcmp{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}.tcmp button{display:flex;flex-direction:column;gap:2px;text-align:left;background:#0c1119;border:1px solid var(--line-2);border-radius:9px;padding:7px 8px;color:inherit;cursor:pointer;min-width:0}.tcmp button.on{border-color:#e7c46a;box-shadow:0 0 0 1px #e7c46a inset}.tcmp small{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tsum .sub{font-size:11.5px;color:var(--muted,#9aa6b8);margin:2px 0 4px}.srow{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:2px 0}.srow .sl{flex:0 0 42%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sbar{flex:1;height:7px;background:#121a26;border-radius:4px;overflow:hidden}.sbar i{display:block;height:100%;background:linear-gradient(90deg,#4a6fd1,#7aa7ff)}.srow b{min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.sarmgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.sarm{background:#0c1119;border:1px solid var(--line-2);border-radius:9px;padding:8px 10px}.sarm .sh{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}.sarm .sh small{margin-left:auto}
@media (max-width:760px){.itdist,.tcmp{grid-template-columns:repeat(4,minmax(0,1fr))}.ittable .why{max-width:none}}
/* 티어 요약 2 */
.stiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:10px}.stile{background:#0c1119;border:1px solid var(--line-2);border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}.stile small{font-size:11px}.stile b{font-size:16px;font-variant-numeric:tabular-nums}
.sumsec{margin-top:14px}.sumsec h3{display:flex;align-items:center;gap:8px;font-size:14px;margin:0 0 6px}.sumsec h3>span{color:var(--primary)}.sumsec h3 small{font-weight:400;color:var(--muted,#9aa6b8);font-size:11.5px}
.sumrow{border-bottom:1px solid #1b2330}.sumrow>summary,.sumrow.head{display:grid;grid-template-columns:minmax(110px,1fr) minmax(120px,1.2fr) 56px;gap:4px 10px;align-items:center;padding:7px 6px;list-style:none;cursor:pointer;font-size:12.5px}.sumrow>summary::-webkit-details-marker{display:none}.sumrow>summary:hover{background:#111925}.sumrow.head{cursor:default;font-size:11px;color:var(--muted,#9aa6b8);border-bottom:1px solid var(--line-2)}
.sumrow .car{display:inline-block;width:12px;color:var(--muted,#9aa6b8);transition:transform .15s}.sumrow[open] .car{transform:rotate(90deg)}.sumrow .c4{grid-column:1/-1;min-width:0;padding-left:18px;color:#c9d3e2}.sumrow.head .c4{padding-left:0;color:inherit}.sumrow .c3{text-align:right}.sumrow .c4>div{white-space:normal}
.pbar{display:flex;align-items:center;gap:6px}.pbar .sbar{flex:1;min-width:40px}.pbar b{min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
.sumfull{padding:4px 6px 10px 22px}.sumlist{width:100%;border-collapse:collapse;font-size:12px}.sumlist th{text-align:left;font-weight:500;color:var(--muted,#9aa6b8);font-size:11px;padding:4px 6px;border-bottom:1px solid var(--line-2)}.sumlist td{padding:4px 6px;border-bottom:1px solid #161e2a;vertical-align:middle}.sumlist td:nth-child(3){width:28%}
.partgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.ittable tr.off td{opacity:.55}
@media (max-width:760px){.stiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.nav-sep{border:0;border-top:1px solid #1e2836;margin:8px 4px}.nav-group>summary{cursor:pointer;list-style:none;user-select:none}.nav-group>summary::-webkit-details-marker{display:none}.nav-group>summary::before{content:'▸';display:inline-block;width:14px}.nav-group[open]>summary::before{content:'▾'}.nav-group>summary:hover{color:#a9b3c4}
.nav-cap{font-size:10px;letter-spacing:1.6px;color:#5f6b80;font-weight:650;padding:14px 12px 8px}
.nav-cap:first-child{padding-top:0}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:#a9b3c4;text-align:left;padding:9px 12px;margin:2px 0;border-radius:8px;font-size:13px;transition:background .15s,color .15s}
.nav-btn:hover{background:#ffffff08;color:var(--text)}
.nav-btn .ic{width:18px;text-align:center;opacity:.8}
.nav-btn.on{background:linear-gradient(90deg,#6ea8ff26,#6ea8ff06);color:#d8e6ff;box-shadow:inset 3px 0 var(--primary)}
.nav-btn.on .ic{opacity:1;color:var(--primary);text-shadow:0 0 12px #6ea8ff88}
.nav-btn .badge{margin-left:auto;font-size:10px;color:var(--muted);background:#ffffff0a;border-radius:10px;padding:1px 7px}
.drawer-foot{margin-top:auto;border-top:1px solid #1b2330;padding:14px 10px 0;font-size:11px;color:var(--dim);line-height:1.8}
.drawer-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 8px var(--green)}
.mono{font-family:Consolas,"Cascadia Mono",monospace}

/* main */
main{margin-left:var(--drawer);padding:26px 32px 60px;max-width:1500px}
.crumb{font-size:11px;color:var(--dim);margin-bottom:8px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.head h1{font-size:27px;font-weight:720;letter-spacing:-.6px;background:linear-gradient(90deg,#f2f6ff,#b7cdf5);-webkit-background-clip:text;background-clip:text;color:transparent}
.head p{color:var(--muted);font-size:13px;margin-top:5px;max-width:760px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{position:relative;background:linear-gradient(180deg,#141a24,#0f141c);border:1px solid #1f2835;border-radius:var(--r);padding:20px;box-shadow:0 1px 0 #ffffff07 inset,0 12px 32px #00000040;min-width:0;transition:border-color .2s}
.card:hover{border-color:#2a3546}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h2{font-size:15px;font-weight:660;display:flex;align-items:center;gap:9px}
.card-h h2 .ic{color:var(--primary)}
.card-h p{color:var(--muted);font-size:12px;margin-top:3px}
.card.off{opacity:.55}
.sub{font-size:11px;letter-spacing:1.2px;color:var(--dim);font-weight:650;margin:18px 0 8px;text-transform:uppercase}
.sub:first-child{margin-top:0}

/* controls */
.ctl{padding:10px 0;border-top:1px dashed #1e2733}
.ctl:first-of-type{border-top:0}
.ctl.dis{opacity:.45}
.ctl.dis *{cursor:not-allowed}
.ctl-h{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:13px}
.ctl-h .val{margin-left:auto;font-size:12px;color:#cfe0ff;background:#6ea8ff14;border:1px solid #6ea8ff30;border-radius:6px;padding:1px 8px;white-space:nowrap}
.tip{position:relative;display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid #3a4558;color:var(--muted);font-size:10px;cursor:help;flex-shrink:0}
.tip:hover:after,.tip:focus:after{content:attr(data-tip);position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:max-content;max-width:280px;background:#1b2433;border:1px solid var(--line-2);color:var(--text);font-size:12px;line-height:1.5;padding:8px 10px;border-radius:8px;z-index:60;box-shadow:0 8px 24px #0009;white-space:normal}
.ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--dim);margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;--p:50%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--primary) var(--p),#273142 var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--primary) var(--p),#273142 var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 0 0 3px #6ea8ff55,0 2px 6px #0008}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff;box-shadow:0 0 0 3px #6ea8ff55}
input[type=range]:disabled{filter:grayscale(1)}
.range2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.range2 label{font-size:10.5px;color:var(--dim)}
.sw{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw .tr{width:36px;height:20px;border-radius:20px;background:#323c4d;position:relative;flex-shrink:0;transition:.15s}
.sw .tr:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#aeb7c6;transition:.15s}
.sw input:checked+.tr{background:linear-gradient(90deg,#3d6fd1,#6ea8ff)}
.sw input:checked+.tr:after{left:19px;background:#fff;box-shadow:0 0 8px #6ea8ffaa}
.sw input:disabled+.tr{opacity:.4}
.sw input:focus-visible+.tr{outline:2px solid var(--primary);outline-offset:3px}
.sw-row{display:flex;align-items:center;gap:8px}
.sw-row .grow{flex:1}
.ratio-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#1c2431;margin:4px 0 8px}
.ratio-bar span{height:100%;transition:width .15s}
.ratio-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:4px 14px}
.ratio-grid .r-l{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.ratio-grid .r-l i{width:8px;height:8px;border-radius:2px;display:inline-block}
.ratio-grid .r-l b{margin-left:auto;color:var(--text);font-weight:600}
.sum{font-size:11px;padding:1px 7px;border-radius:6px}
.sum.ok{color:var(--green);background:#5fd4a614}
.sum.bad{color:var(--amber);background:#f0c07014}
.mini-btn{border:1px solid var(--line-2);background:#0e131b;border-radius:7px;padding:4px 10px;font-size:12px;color:var(--muted)}
.mini-btn:hover{color:var(--text);border-color:#3a4760}
.btn{border:1px solid var(--line-2);background:#121925;border-radius:8px;padding:7px 14px;font-size:12.5px}
.btn:hover{border-color:#3d4b63}
.btn.pri{background:linear-gradient(180deg,#78b0ff,#4f8ef0);color:#06101f;border-color:transparent;font-weight:650}
.btn.danger{color:var(--red);border-color:#f27f8c44}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=number],input[type=text],textarea{background:#0c1119;border:1px solid var(--line-2);border-radius:7px;padding:5px 8px;outline:none;width:100%}
input[type=number]{width:70px;text-align:right}

/* ===== 1.0 아이템 티어: 무기·방어구·탄약의 티어를 근거와 함께 보고 바꾼다 ===== */
let modSort='count',tSort='weight',tShow=150;let itSec='weapons',itKind='all',itQ='',itSrc='all',itOnly=false,itSort='tier',itTier=-1,itMore=0,itHowOpen=true;const itSel=new Set();

function itWhy(x){

function itTierSeg(x){const m=itMan(x),a=itAuto(x);
  return `<div class="tseg"><button data-itset="${x.id}|0" class="${m?'':'on'}" title="${esc(tr(T('자동으로 되돌리기','Back to automatic')))}">${tr(T('자동','Auto'))} T${a}</button>${[1,2,3,4,5,6,7].map(n=>`<button data-itset="${x.id}|${n}" class="${m===n?'on man':!m&&a===n?'ghost':''}">T${n}</button>`).join('')}</div>`;}
P.itemtiers={desc:T('무기·방어구·탄약이 몇 티어부터 나오는지 정합니다. 자동 티어가 왜 그 값인지 함께 보여 줍니다. 여기서 바꾼 티어는 모든 봇과 모든 표에 공통입니다.','Set which tier each weapon, armor piece and ammo appears from, with the reason for its automatic tier. Shared by every bot and table.'),render(){
  if(!GEAR_CATALOG)return `<div class="stack">${gearOff()}${notice(T('서버에 연결하면 설치된 아이템(바닐라·모드) 목록이 여기 나옵니다.','Installed items (vanilla + mods) appear here once the server is connected.'),'flat')}</div>`;
  const man=state.gear.itemTier||{},manCount=Object.keys(man).length;
  const how=`<details class="card fold how"${itHowOpen?' open':''} data-ithow><summary><h2>ⓘ ${tr(T('티어는 이렇게 정해집니다','How tiers are decided'))}</h2></summary><div class="howgrid">
    <div><b>⌖ ${tr(T('무기 · 방어구 · 장비','Weapons · armor · gear'))}</b><p>${tr(T('같은 장비 칸(예: 주무기, 헬멧)에 들어가는 아이템을 가격순으로 줄 세워 7등분합니다. 가장 싼 1/7이 T1, 가장 비싼 1/7이 T7입니다. 총은 기본 부품을 단 조립 가격으로 봅니다. 봇 기본 장비 목록에 없는 아이템(주로 모드 아이템)은 같은 종류끼리(예: 돌격소총끼리) 비교합니다. 그래서 같은 가격이라도 비교 묶음의 크기에 따라 티어가 달라질 수 있습니다.','Items of the same gear slot (e.g. primary weapons, headwear) are sorted by price and split into 7 equal parts: cheapest 1/7 = T1, most expensive 1/7 = T7. Guns use their assembled (default build) price, items not in any bot default list (mostly mod items) are compared within their type (e.g. assault rifles), so the same price can land in different tiers.'))}</p></div>
    <div><b>⛨ ${tr(T('방탄 등급','Armor class'))}</b><p>${tr(T('헬멧·방탄복·방탄 리그는 가격 티어와 별개로, 그 티어의 판 등급 상한(티어 편집기 → 상한·방탄판)보다 등급이 높으면 나오지 않습니다.','Helmets, vests and armored rigs also never appear above the tier\'s plate class cap (Tier editor → Caps & plates).'))}</p></div>
    <div><b>⁍ ${tr(T('탄약 · 소모품','Ammo · consumables'))}</b><p>${tr(T('탄약은 같은 구경끼리, 의약품·주사기·투척물·음식·음료는 같은 종류끼리 가격순 7등분합니다. 탄약은 여기에 더해 티어마다 정한 관통 상한보다 관통력이 높으면 나오지 않습니다.','Ammo is split by price within its caliber; meds, stims, throwables, food and drinks within their type. Ammo above the tier\'s pen cap never appears.'))}</p></div>
    <div><b>⚙ ${tr(T('부착물','Attachments'))}</b><p>${tr(T('조준경·머즐·손잡이 같은 부착물도 종류 안 가격순 7등분입니다. 봇 티어보다 높은 부착물은 달지 않지만, 그 총에 맞는 부착물이 전부 티어 위면 가장 낮은 티어 것을 달아 부착물이 아예 안 달리는 일은 없습니다(무기 구성에서 끌 수 있음).','Attachments are split by price within each type too. Bots skip parts above their tier, but if every fitting part is above it the lowest-tier one is used, so guns are never left bare (can be turned off in Weapon build).'))}</p></div>
    <div><b>✎ ${tr(T('직접 정하기','Manual tier'))}</b><p>${tr(T('여기서 T1~T7을 고르면 자동 대신 그 값을 씁니다. 봇은 자기 티어 이하 아이템을 쓰고, 낮은 티어 아이템일수록 적게 고릅니다. 티어 편집기에 직접 넣은 아이템은 무게대로 쓰지만, 여기서 티어를 정한 아이템은 그 티어부터만 나옵니다.','Picking T1–T7 here overrides the automatic tier. Bots use items up to their own tier, lower tiers less often. Items added in the Tier editor follow their weights, but an item with a manual tier here only appears from that tier.'))}</p></div></div></details>`;
  const secTabs=`<div class="tabs">${IT_SECS.map(([k,l,i])=>`<button data-it="sec|${k}" class="${k===itSec?'on':''}">${i} ${tr(l)} <small>${GEAR_CATALOG.filter(x=>x.section===k).length}</small></button>`).join('')}</div>`;
  const kinds=itKinds().map(([k,l])=>[k,l,GEAR_CATALOG.filter(x=>x.section===itSec&&x.slot===k).length]).filter(x=>x[2]);
  const kindBar=itSec==='ammo'?`<div class="sw-row"><span class="small muted">${tr(T('구경','Caliber'))}</span><select id="itKindSel"><option value="all">${tr(T('전체','All'))}</option>${kinds.map(([k,l,n])=>`<option value="${k}" ${k===itKind?'selected':''}>${esc(tr(l))} (${n})</option>`).join('')}</select></div>`
    :`<div class="chips">${[['all',T('전체','All'),GEAR_CATALOG.filter(x=>x.section===itSec).length],...kinds].map(([k,l,n])=>`<button class="chipbtn ${k===itKind?'on':''}" data-it="kind|${k}">${tr(l)} <small>${n}</small></button>`).join('')}</div>`;
  const base=itBase(),dist=[0,1,2,3,4,5,6].map(i=>{const l=base.filter(x=>itEff(x)===i+1),v=l.map(x=>x.price);return {n:l.length,lo:v.length?Math.min(...v):0,hi:v.length?Math.max(...v):0,man:l.filter(itMan).length};}),max=Math.max(1,...dist.map(d=>d.n));
  const distBar=`<div class="itdist">${dist.map((d,i)=>`<button data-it="tier|${i}" class="${itTier===i?'on':''}" title="${esc(tr(T('눌러서 이 티어만 보기','Click to show only this tier')))}"><b>T${i+1}</b><span class="bar"><i style="height:${Math.round(d.n/max*100)}%"></i></span><em>${d.n}${tr(T('개','')) }</em><small>${d.n?rub(d.lo)+'–'+rub(d.hi):'—'}</small><small class="muted">Lv ${state.gear.tiers[i].min}–${state.gear.tiers[i].max}</small>${d.man?`<small class="man">✎ ${d.man}</small>`:''}</button>`).join('')}</div>`;
  const tools=`<div class="sw-row ittools"><input type="search" id="itSearch" placeholder="${tr(T('이름 · ID · 모드 이름 검색','Search name · ID · mod'))}" value="${esc(itQ)}"><div class="seg">${[['all',T('전체','All')],['vanilla',T('바닐라','Vanilla')],['mod',T('모드','Mods')],['off',T('꺼진 모드','Disabled mods')]].map(([k,l])=>`<button data-it="src|${k}" class="${itSrc===k?'on':''}">${tr(l)}</button>`).join('')}</div><button class="chipbtn ${itOnly?'on':''}" data-it="only|1">✎ ${tr(T('직접 정한 것만','Manual only'))}</button><span class="small muted">${tr(T('정렬','Sort'))}</span><div class="seg">${[['tier',T('티어','Tier')],['price',T('가격','Price')],...(itSec==='ammo'?[['pen',T('관통','Pen')]]:[]),['name',T('이름','Name')],['src',T('출처','Source')]].map(([k,l])=>`<button data-it="sort|${k}" class="${itSort===k?'on':''}">${tr(l)}</button>`).join('')}</div></div>`;
  const list=itList(),shown=list.slice(0,150*(itMore+1)),allSel=list.length&&list.every(x=>itSel.has(x.id));
  const bulk=itSel.size?`<div class="itbulk"><b>${fmt(tr(T('{n}개 선택','{n} selected')),{n:itSel.size})}</b><span class="small muted">→</span>${[1,2,3,4,5,6,7].map(n=>`<button class="mini-btn" data-itbulk="${n}">T${n}</button>`).join('')}<button class="mini-btn" data-itbulk="0">${tr(T('자동으로','Automatic'))}</button><button class="mini-btn" data-it="selnone|1">${tr(T('선택 해제','Clear selection'))}</button></div>`:'';
  const rows=shown.map(x=>{const nm=lang==='ko'?x.ko||x.en:x.en||x.ko,m=itMan(x);return `<tr class="${m?'man':''}${itSel.has(x.id)?' sel':''}${modOff(x)?' off':''}"><td><button class="ck" data-itsel="${x.id}" aria-label="${esc(tr(T('선택','Select')))}">${itSel.has(x.id)?'☑':'☐'}</button></td><td><b>${esc(nm)}</b><div class="small muted">${srcPill(x.source||'vanilla')}${modOff(x)?' '+pill(tr(T('꺼진 모드','Disabled mod')),'bad'):''}${x.armorClass>0&&x.section==='armor'?' '+pill(tr(T('등급','Class'))+' '+x.armorClass,'gold'):''}</div></td><td class="num">${rub(x.price)}${x.section==='ammo'?`<div>${pill(tr(T('관통','Pen'))+' '+Math.round(x.pen),'gold')}</div>`:''}</td><td class="why small">${esc(itWhy(x))}${m&&m!==itAuto(x)?`<div class="man">✎ ${fmt(tr(T('직접 정함: 자동 T{a} → T{m}','Manual: auto T{a} → T{m}')),{a:itAuto(x),m})}</div>`:''}</td><td>${itTierSeg(x)}</td></tr>`;}).join('');
  const table=list.length?`<div class="tw"><table class="ittable"><thead><tr><th><button class="ck" data-it="selall|1" title="${esc(tr(T('보이는 것 모두 선택','Select all shown')))}">${allSel?'☑':'☐'}</button></th><th>${tr(T('아이템','Item'))}</th><th class="num">${tr(T('가격','Price'))}</th><th>${tr(T('왜 이 티어?','Why this tier?'))}</th><th>${tr(T('티어 (자동 / 직접)','Tier (auto / manual)'))}</th></tr></thead><tbody>${rows}</tbody></table></div>${list.length>shown.length?`<button class="btn" data-it="more|1" style="margin-top:10px">${fmt(tr(T('더 보기 ({n}개 남음)','Show more ({n} left)')),{n:list.length-shown.length})}</button>`:''}`:notice(T('조건에 맞는 아이템이 없습니다.','No items match.'),'flat');
  const head=`<div class="chips">${pill(fmt(tr(T('직접 정한 아이템 {n}개','{n} manual tiers')),{n:manCount}),manCount?'gold':'')}${manCount?`<button class="mini-btn" data-it="reset|1">${tr(T('이 분류의 직접 지정 모두 자동으로','Reset manual tiers in this view'))}</button>`:''}</div>`;
  return `<div class="stack">${gearOff()}${how}${card(T('아이템 티어','Item tiers'),`${secTabs}${kindBar}${distBar}${tools}${bulk}${table}`,{icon:'▦',right:head})}</div>`;}};
P.tieredit={desc:T('봇마다 T1~T7에 들고 나올 아이템과 비율을 고칩니다. 왼쪽에서 봇을 켜고 고르고, 오른쪽에서 티어와 칸을 골라 고칩니다.','Edit what each bot carries in T1–T7. Pick a bot on the left, then a tier and slot.'),render(){return `<div class="stack">${gearOff()}${tierEditor()}</div>`;}};

P.items={desc:T('모드로 추가된 무기·장비를 봇이 얼마나 쓸지 정합니다. 레이드마다 일부만 쓰면 램을 크게 아낍니다.','How much modded gear bots use. A per-raid subset saves a lot of RAM.'),render(){
  const m=state.mods,dis=!m.subset;
  const all=(MODS[modTab]||[]).filter(([,n])=>n.toLowerCase().includes(modSearch.toLowerCase()));
  const sel=(MODS[modTab]||[]).filter(([id])=>(m.allowed[modTab]||{})[id]).reduce((a,[, ,c])=>a+c,0);
  const save=Math.round(((200-m.weapons)/200*90+(1000-m.attachments)/1000*60+(200-m.equipment)/200*35+(100-m.clothing)/100*10)*(m.subset?1:0));
  return `<div class="stack">${gearOff()}<div class="grid g2">
  ${card(T('레이드마다 일부만 사용','Per-raid subset'),sw('mods.subset',T('켜기 (램 절약)','Enable (save RAM)'),T('레이드 시작 때 이번 판 모드 아이템을 뽑습니다. 무기를 뽑으면 그 무기 전용 부품은 자동 포함.','Rolls this raid’s mod items. A rolled weapon brings its own parts.'))
    +slider('mods.weapons',T('모드 무기','Mod weapons'),'',{min:0,max:200,unit:'',dis})+slider('mods.attachments',T('모드 부착물','Mod attachments'),'',{min:0,max:1000,step:10,unit:'',dis,adv:true})
    +slider('mods.equipment',T('모드 장비','Mod equipment'),'',{min:0,max:200,unit:'',dis})+slider('mods.clothing',T('모드 옷 (부위별)','Mod clothing (per slot)'),'',{min:0,max:100,unit:'',dis,adv:true})
    +notice(fmt(tr(T('예상: 사망 1명당 램 증가가 약 {n}% 줄어듭니다 (모두 허용 대비, 대략값).','Estimate: ~{n}% less RAM growth per death (rough).')),{n:Math.min(80,Math.round(save/2))}),m.subset?'':'flat'),{icon:'▤'})}
  ${card(T('등장 비율','Frequency'),slider('mods.mult',T('모드 아이템 등장 배율','Mod item weight'),T('100% = 바닐라와 같은 무게.','100% = same as vanilla.'),{min:0,max:200,step:5})+sw('mods.pmcOnly',T('모드 장비는 PMC만','Mod gear for PMCs only'),'')
    +notice(T('부품 확률은 SPT 기본값을 씁니다. 다른 모드가 바꿔도 되돌립니다(오류·램 누수 방지).','Part chances use SPT defaults and are restored if changed (prevents errors/leaks).'),'flat'),{icon:'⚖'})}</div>
  ${card(T('허용할 모드 (실제 설치된 모드)','Allowed mods (installed)'),modSourceList(),{desc:T('체크를 푼 모드의 아이템은 봇이 쓰지 않습니다. 티어 편집기에서는 "허용 안 한 모드"로 표시됩니다. 바닐라 아이템은 항상 허용입니다.','Bots skip items from unchecked mods; the tier editor marks them "Mod not allowed". Vanilla items are always allowed.')})}
  </div>`;}};

P.client={desc:T('게임(클라이언트)이 레이드 시작 때 서버에서 받아 가는 값입니다. 게임 안 F12 메뉴는 없습니다.','Values the game fetches at raid start. No in-game F12 menu.'),render(){
  const c=state.client;
  const rows=MAPS.map(m=>{const p='maps.'+m.id+'.';return `<tr><td class="mapname"><b>${tr(m.name)}</b><small>${m.id}</small></td><td>${num(p+'cap',4,40)}</td><td>${num(p+'pmcDist',0,300)}</td><td>${num(p+'scavDist',0,300)}</td></tr>`;}).join('');
  return `<div class="stack">${notice(T('레이드 시작 때 게임이 이 값을 받아 갑니다. 레이드 중에 바꾸면 다음 레이드부터 적용됩니다.','Read at raid start; mid-raid changes apply next raid.'))}
  <div class="grid g2">
  ${card(T('성능','Performance'),choice('client.perf',T('성능 모드','Performance mode'),'',[['quality','◆',T('품질','Quality'),T('봇을 넉넉히 미리 만듭니다.','Prepares bots generously.')],['balanced','◈',T('균형','Balanced'),T('대부분 PC에 권장.','Recommended.')],['light','◇',T('가볍게','Light'),T('스폰을 나눠 끊김을 줄입니다.','Spreads spawns.')]])
    +slider('client.preload',T('봇 미리 만들어 두기','Pre-generated bots'),T('다음 웨이브 봇을 미리 만들어 끊김을 줄입니다.','Pre-builds next-wave bots.'),{min:0,max:20,unit:UI.ppl})
    +slider('client.perFrame',T('프레임당 봇 생성 상한','Bots created per frame'),'',{min:1,max:5,unit:UI.ppl,adv:true})
    +sw('client.pmcAnywhere',T('PMC 아무 데서나 스폰 허용','Allow PMC spawns anywhere'),T('PMC 전용 지점이 아니어도 나옵니다.','Not limited to PMC points.'),{adv:true}),{icon:'⚙'})}
  ${card(T('Gravity가 하지 않는 일','What Gravity never does'),`<p class="muted small">${tr(T('ORBIT이 맡는 기능이라 Gravity에는 없습니다. 함께 쓰면 충돌합니다.','These belong to ORBIT and are not in Gravity.'))}</p>`
    +[T('멀리 있는 봇 재우기 (AI 리미터)','Sleeping far bots (AI limiter)'),T('보이지 않는 봇 컬링','Culling unseen bots'),T('멀리 있는 봇 지우고 다시 뽑기','Despawning far bots'),T('봇 이동·목표 정하기','Bot movement and objectives')].map(x=>`<div class="lock"><b>${tr(x)}</b>${pill('ORBIT · SAIN')}</div>`).join('')
    +`<div class="lock">✓ <b>${tr(T('지원하지 않는 맵(쇄빙선·터미널 등)에서는 손 떼기','Hands off unsupported maps'))}</b>${pill(u('on'),'good')}</div>`,{icon:'⊘'})}</div>
  ${card(T('맵별 상한 · 거리','Per-map cap · distance'),`<div class="tw"><table class="ntab"><thead><tr><th>${tr(T('맵','Map'))}</th><th>${tr(T('동시 봇 상한','Max alive'))}</th><th>${tr(T('PMC 최소 거리 (m)','PMC min distance (m)'))}</th><th>${tr(T('스캐브 최소 거리 (m)','Scav min distance (m)'))}</th></tr></thead><tbody>${rows}</tbody></table></div>`,{desc:T('보스·호위 포함. 넘으면 다음 스폰은 자리가 날 때까지 기다립니다.','Includes bosses. Spawns wait for free slots.')})}
  </div>`;}};

const renderItems=P.items.render;P.items.render=function(){return renderItems()+card(T('아이템 티어 직접 지정','Manual item tiers'),`<p class="muted small">${tr(T('무기·방어구·탄약의 티어 지정은 "아이템 티어" 메뉴로 옮겼습니다. 자동 티어가 왜 그 값인지도 거기서 볼 수 있습니다.','Item tiers moved to the "Item tiers" page, which also explains each automatic tier.'))}</p><button class="btn pri" data-nav="itemtiers" style="margin-top:10px">▦ ${tr(T('아이템 티어 열기','Open item tiers'))} →</button>`,{icon:'▦'});};

P.orbit={desc:T('ORBIT과 함께 쓸 때 서로 겹치지 않게 맞추는 설정입니다. ORBIT 설정은 읽기만 합니다.','Keeps Gravity and ORBIT in step. ORBIT settings are read-only here.'),render(){
  const O=serverMeta?serverMeta.orbit:{installed:true,version:'3.1',configRead:true,limiter:true,sleepDistance:250,wakeDistance:200,minAwake:6,extractPmc:true,playerScav:true,factionTakeover:['isb'],vanillaTakeover:['raiders','rogues']};
  const on=v=>v?u('on'):u('off'),FN={ruaf:'RUAF',untar:'UNTAR',blackdiv:T('블랙 디비전','Black Division'),isb:'ISB',combine:T('컴바인','Combine')},VN={scavs:T('스캐브','Scavs'),goons:T('굿즈','Goons'),cultists:T('컬티스트','Cultists'),raiders:T('레이더','Raiders'),rogues:T('로그','Rogues'),bloodhounds:T('블러드하운드','Bloodhounds')};
  const names=(a,M)=>(a||[]).map(x=>M[x]?tr(M[x]):x).join(' · ')||tr(T('없음','None'));
  const inst=!!(O&&O.installed),ghost=inst?Math.max(O.sleepDistance||0,O.wakeDistance||0)+10:260;

P.raidpresets={desc:T('스폰 흐름·맵별 설정·근처 보충·보스·특수 봇·팩션 모드·이벤트 값을 묶어 저장하고 바꿔 씁니다. 장비 설정은 건드리지 않습니다.','Save and switch spawn, map, near, boss, special, faction and event settings. Loadout is untouched.'),render(){

   <h3 class="ps-h">${tr(T('부분 프리셋 — 일부만 저장해 나머지는 그대로 두고 덮어씁니다','Partial presets — store only part and overwrite just that'))}</h3><p class="muted small" style="margin:-4px 0 10px">${tr(T('스폰 프리셋 = 모든 맵 공통 스폰 흐름 + 13개 맵 설정. 맵 프리셋 = 고른 맵 하나의 설정(다른 맵에도 적용 가능). 보스·특수 봇·이벤트는 통합 프리셋에만 들어갑니다.','Spawn preset = shared spawn flow + all 13 maps. Map preset = one chosen map (can be applied to others). Bosses, specials and events are only in combined presets.'))}</p><div class="preset-pair">${spawnPresetBox('all')}${spawnPresetBox('map')}</div>

P.gearpresets={desc:T('T1~T7 값, 티어 편집기 표, 봇별 장비·무기 구성·모드 아이템 설정을 묶어 저장하고 바꿔 씁니다. 레이드 설정은 건드리지 않습니다.','Save and switch tiers, editor tables, per-bot gear, weapon build and mod item settings. Raid settings are untouched.'),render(){

async function boot(){

async function saveToServer(){
